<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pink & JARVIS AI Studio</title>
    <meta name="description" content="Interface imersiva e minimalista da IA PINK com presença holográfica viva, comandos de voz, visão computacional e caixa de envio de mensagens e arquivos." />
    <meta property="og:title" content="Pink & JARVIS AI Studio" />
    <meta property="og:description" content="Interface imersiva e minimalista da IA PINK com presença holográfica viva, comandos de voz, visão computacional e caixa de envio de mensagens e arquivos." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      html,body,#root{min-height:100%;margin:0;background:#070206;color:#f8fafc}
      #pink-pages-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070206;color:#f9a8d4;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;z-index:99999;letter-spacing:.08em}
      #pink-pages-boot small{display:block;margin-top:.6rem;color:#94a3b8;text-align:center;letter-spacing:0}
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-pink-500 selection:text-white">
    <div id="root"></div>
    <div id="pink-pages-boot">PINK // INICIALIZANDO<small>Lean Performance Solutions</small></div>

    <script>
      (() => {
        const isGitHubPages = location.hostname === 'ricardoprf.github.io';
        if (!isGitHubPages) return;

        const RAW_BASE = 'https://raw.githubusercontent.com/RICARDOPRF/Pink-Sartk-/main/pages-runtime';
        const boot = document.getElementById('pink-pages-boot');

        async function loadText(url) {
          const response = await fetch(`${url}?v=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status} em ${url}`);
          return response.text();
        }

        async function bootPagesRuntime() {
          try {
            const [css, js] = await Promise.all([
              loadText(`${RAW_BASE}/pink-stark.css`),
              loadText(`${RAW_BASE}/pink-stark.js`),
            ]);

            const style = document.createElement('style');
            style.dataset.pinkPagesRuntime = 'css';
            style.textContent = css;
            document.head.appendChild(style);

            const moduleBlob = new Blob([js + '\n//# sourceURL=pink-stark-pages-runtime.js'], { type: 'text/javascript' });
            const moduleUrl = URL.createObjectURL(moduleBlob);
            await import(moduleUrl);
            window.setTimeout(() => URL.revokeObjectURL(moduleUrl), 30000);
            boot?.remove();
          } catch (error) {
            console.error('Pink Pages runtime failed', error);
            if (boot) {
              boot.innerHTML = 'PINK // ERRO DE INICIALIZAÇÃO<small>Atualize a página em alguns segundos. Se persistir, verifique o deploy no GitHub Actions.</small>';
            }
          }
        }

        bootPagesRuntime();
      })();
    </script>

    <!-- Vite consumes this entry during development/custom Actions build. On legacy Pages
         the resilient loader above renders the committed production runtime instead. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Deploy Pink Stark to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pink-sartk-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static frontend
        run: npm run build
        env:
          NODE_ENV: production
          VITE_PINK_SUPABASE_URL: ${{ vars.VITE_PINK_SUPABASE_URL }}
          VITE_PINK_SUPABASE_ANON_KEY: ${{ vars.VITE_PINK_SUPABASE_ANON_KEY }}

      - name: Validate Pages artifact
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "Pages artifact ready: $(du -sh dist | cut -f1)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

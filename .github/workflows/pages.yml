name: Deploy Pink Stark to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pink-sartk-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static frontend
        run: npm run build
        env:
          NODE_ENV: production
          VITE_PINK_SUPABASE_URL: ${{ vars.VITE_PINK_SUPABASE_URL }}
          VITE_PINK_SUPABASE_ANON_KEY: ${{ vars.VITE_PINK_SUPABASE_ANON_KEY }}

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          JS_FILE="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n 1)"
          CSS_FILE="$(find dist/assets -maxdepth 1 -type f -name 'index-*.css' | head -n 1)"
          test -n "$JS_FILE"
          test -n "$CSS_FILE"
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "Pages artifact ready: $(du -sh dist | cut -f1)"

      - name: Persist resilient Pages runtime
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          JS_FILE="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n 1)"
          CSS_FILE="$(find dist/assets -maxdepth 1 -type f -name 'index-*.css' | head -n 1)"
          mkdir -p pages-runtime
          cp "$JS_FILE" pages-runtime/pink-stark.js
          cp "$CSS_FILE" pages-runtime/pink-stark.css
          printf '%s\n' "${GITHUB_SHA}" > pages-runtime/version.txt

          if git diff --quiet -- pages-runtime && git diff --cached --quiet; then
            echo "Pages runtime already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-runtime
          git commit -m "chore(pages): sync compiled Pink Stark runtime [skip ci]"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
